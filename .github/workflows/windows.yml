name: Windows installer

on:
  push:
    branches:
      - main
      - cursor/wooly-launcher-v1-f472
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0 --config.confirmModulesPurge=false
      - run: pnpm test
      - run: pnpm typecheck
      - name: Stamp installer version
        run: node scripts/stamp-version.mjs ${{ github.run_number }}
      - name: Build Windows installer
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: wooly-launcher-windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v0.1.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          shopt -s nullglob
          files=(dist/*.exe dist/*.yml dist/*.blockmap)
          gh release create "$tag" "${files[@]}" \
            --title "Wooly Launcher 0.1.${{ github.run_number }}" \
            --notes "Windows installer. Wooly checks this GitHub Release for in-app updates."
