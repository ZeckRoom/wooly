name: Windows installer

on:
  push:
    branches:
      - main
      - cursor/wooly-launcher-v1-f472
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:win
      - uses: actions/upload-artifact@v4
        with:
          name: wooly-launcher-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
