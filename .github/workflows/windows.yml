name: Windows installer

on:
  push:
    branches:
      - main
      - cursor/wooly-launcher-v1-f472
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0 --config.confirmModulesPurge=false
      - run: pnpm test
      - run: pnpm typecheck
      - name: Stamp installer version
        run: node scripts/stamp-version.mjs ${{ github.run_number }}
      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec electron-vite build
          if ("${{ github.event_name }}" -eq "pull_request") {
            pnpm exec electron-builder --win --publish never
          } else {
            pnpm exec electron-builder --win --publish always
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wooly-launcher-windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
